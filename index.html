<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>Scripture Memory</title>
</head>
<body data-theme="sepia">
    <main class="wrap">
        <header class="top">
            <h1>Scripture Memory</h1>
            <p class="sub">Pick a verse. Choose a game. Memorize step by step.</p>
            <br>
            <div class="topNav">
                <div class="tabs">
                    <button type="button" id="tabLibrary" class="tab">Library</button>
                    <button type="button" id="tabSettings" class="tab">Settings</button>
                </div>
                <div class="authControls">
                    <button type="button" id="btnLogin">Login with Google</button>
                    <button type="button" id="btnLogout" class="isHidden">Logout</button>
                </div>
            </div>
            <div class="result" id="authMsg">Not signed in.</div>
        </header>

        <br>

        <!-- Game Selection Page -->
        <section id="pageGame" class="isHidden">
            <section class="card">
                <h2 id="gameTitle">Choose a game</h2>
                <div class="ref" id="gameRef"></div>
                <div class="ref" id="gameMemoryTitle"></div>
                <div class="verse" id="gameVerse"></div>
                <div class="controls">
                    <button type="button" id="modeType">Type from memory</button>
                    <button type="button" id="modeDrag">Tap words into blanks</button>
                    <button type="button" id="modeLetters">First letter mode</button>
                </div>
                <hr class="sep">
                <div class="controls">
                    <button type="button" id="btnBackToLibrary">Back</button>
                </div>
            </section>
        </section>

        <!-- Practice Page -->
        <section id="pagePractice" class="isHidden">
            <section class="card">
                <div class="row">
                    <label>Version</label>
                    <div class="ref" id="practiceVersionLabel"></div>
                </div>

                <div id="lettersGame" class="isHidden">
                    <div class="verse">
                        <label>Reference</label>
                        <div id="refLettersGame"></div>
                    </div>
                    <div id="titleLettersSection" class="verse isHidden">
                        <label>Title</label>
                        <div id="titleLettersGame"></div>
                    </div>
                    <div class="verse">
                        <label>Verse</label>
                        <div id="verseLettersGame"></div>
                    </div>
                </div>

                <div id="dragGame" class="isHidden">
                    <div class="row">
                        <label>Difficulty</label>
                        <div class="controls" id="tapDifficultyRow">
                            <button type="button" id="difficultyEasy" class="difficultyBtn active">Easy</button>
                            <button type="button" id="difficultyMedium" class="difficultyBtn">Medium</button>
                            <button type="button" id="difficultyHard" class="difficultyBtn">Hard</button>
                        </div>
                    </div>

                    <div id="refDragSection">
                        <label>Reference</label>
                        <div class="verse" id="refBlankLine"></div>
                        <div id="refWordBank" class="controls"></div>
                        <hr class="sep">
                    </div>

                    <div id="titleDragSection" class="isHidden">
                        <label>Title</label>
                        <div class="verse" id="titleBlankLine"></div>
                        <div id="titleWordBank" class="controls"></div>
                        <hr class="sep">
                    </div>

                    <label>Verse</label>
                    <div class="verse" id="blankLine"></div>
                    <div id="wordBank" class="controls"></div>
                </div>

                <div class="controls">
                    <button type="button" id="btnHideAll">Reveal All</button>
                </div>

                <hr class="sep">

                <div class="row" id="refAnswerRow">
                    <label>Type Reference from Memory</label>
                    <input id="refAnswer" type="text" placeholder="Type reference here (e.g. John 3:16)">
                </div>

                <div class="row isHidden" id="titleAnswerRow">
                    <label>Type Title from Memory</label>
                    <input id="titleAnswer" type="text" placeholder="Type title here.">
                </div>

                <div class="row" id="answerRow">
                    <label>Type from Memory</label>
                    <textarea id="answer" rows="4"></textarea>
                </div>

                <div class="controls">
                    <button type="button" id="btnReset">Reset</button>
                    <button type="button" id="btnGiveHint">Hint</button>
                    <button type="button" id="btnCheck">Check</button>
                </div>

                <div class="result" id="result"></div>
                <div class="stats" id="stats"></div>

                <div class="controls">
                    <button type="button" id="btnBackToGame">Back</button>
                </div>
            </section>
        </section>

        <!-- Library Page -->
        <section id="pageLibrary">
            <section class="card">
                <h2>Library</h2>
                <div class="row">
                    <label for="pasteBox">Paste from YouVersion</label>
                    <textarea id="pasteBox" rows="6" placeholder="Paste copied verse text, reference, and link from YouVersion here"></textarea>
                </div>
                <div class="controls">
                    <button id="btnAutoFill" type="button">Auto Fill</button>
                    <button id="btnImportCsvPage" type="button">Import CSV</button>
                </div>
                <div class="row">
                    <label for="collectionSelect">Collection</label>
                    <select id="collectionSelect">
                        <option value="">Select collection</option>
                        <option value="__add_new__">+ Add new collection</option>
                    </select>
                </div>
                <div class="row">
                    <label for="groupSelect">Group</label>
                    <select id="groupSelect">
                        <option value="">Select group</option>
                        <option value="__add_new__">+ Add new group</option>
                    </select>
                </div>
                <div class="row">
                    <label for="newTitle">Title (optional)</label>
                    <input id="newTitle" type="text" placeholder="Example: God's Faithfulness">
                </div>
                <div class="row">
                    <label>Reference</label>
                    <input id="newRef">
                </div>
                <div class="row">
                    <label for="newVersion">Version</label>
                    <input id="newVersion" type="text" placeholder="Example: NLT">
                </div>
                <div class="row">
                    <label>Verse text</label>
                    <textarea id="newText" rows="4"></textarea>
                </div>
                <div class="controls">
                    <button type="button" id="btnSaveVerse">Save Verse</button>
                    <button id="btnClearVerse" type="button" class="ghost">Clear</button>
                </div>
                <div class="result" id="ManageMsg"></div>
                <hr class="sep">
                <div id="libraryFilters">
                    <div class="row">
                        <label>Collection</label>
                        <div class="controls" id="collectionFilters" style="touch-action:manipulation"></div>
                        <div class="miniActions">
                            <button type="button" id="btnAddCollectionInline" class="linkBtn">➕ Add Collection</button>
                            <button type="button" id="btnRenameCollectionInline" class="linkBtn">📝 Rename Collection</button>
                            <button type="button" id="btnDeleteCollectionInline" class="linkBtn dangerLink">🗑️ Delete Collection</button>
                        </div>
                    </div>
                    <br>
                    <div class="row">
                        <label>Group</label>
                        <div class="controls" id="groupFilters" style="touch-action:manipulation"></div>
                        <div class="miniActions">
                            <button type="button" id="btnAddGroupInline" class="linkBtn">➕ Add Group</button>
                            <button type="button" id="btnRenameGroupInline" class="linkBtn">📝 Rename Group</button>
                            <button type="button" id="btnDeleteGroupInline" class="linkBtn dangerLink">🗑️ Delete Group</button>
                        </div>
                    </div>
                </div>
                <br>
                <div class="row">
                    <label for="sortSelect">Sort Verses By</label>
                    <select id="sortSelect">
                        <option value="custom">Manual (Drag & Drop)</option>
                        <option value="titleAsc">Title (A → Z)</option>
                        <option value="titleDesc">Title (Z → A)</option>
                        <option value="bibleAsc">Bible Order (Genesis → Revelation)</option>
                        <option value="bibleDesc">Bible Order (Revelation → Genesis)</option>
                    </select>
                </div>
                <br>
                <div id="libraryGrid"></div>
            </section>
        </section>

        <!-- Other sub-pages -->
        <section id="pageAddCollection" class="isHidden">
            <section class="card">
                <h2>Add A New Collection</h2>
                <div class="row">
                    <input id="newCollectionName" type="text" placeholder="Example: Navigators">
                </div>
                <div class="controls">
                    <button id="btnSaveCollection" type="button">Save</button>
                    <button id="btnCancelCollection" type="button" class="ghost">Cancel</button>
                </div>
                <div class="result" id="collectionMsg"></div>
            </section>
        </section>

        <section id="pageAddGroup" class="isHidden">
            <section class="card">
                <h2>Add A New Group</h2>
                <div class="row">
                    <input id="newGroupName" type="text" placeholder="Example: Proclaiming Christ">
                </div>
                <div class="controls">
                    <button id="btnSaveGroup" type="button">Save</button>
                    <button id="btnCancelGroup" type="button" class="ghost">Cancel</button>
                </div>
                <div class="result" id="groupMsg"></div>
            </section>
        </section>

        <section id="pageImportCsv" class="isHidden">
            <section class="card">
                <h2>Import CSV</h2>
                <div class="row">
                    <label for="csvFileInput">Choose CSV file</label>
                    <input id="csvFileInput" type="file" accept=".csv,text/csv">
                </div>
                <div class="controls">
                    <button id="btnImportCsv" type="button">Import CSV</button>
                    <button id="btnCancelImportCsv" type="button" class="ghost">Cancel</button>
                </div>
                <div class="result" id="importCsvMsg"></div>
            </section>
        </section>

        <section id="pageSettings" class="isHidden">
            <section class="card">
                <h2>Settings</h2>
                <div class="row">
                    <label>Color Theme</label>
                    <select id="themeSelect">
                        <option value="sepia" selected>Sepia Light</option>
                        <option value="white">Classic White</option>
                        <option value="warm">Warm Brown</option>
                        <option value="night">Night Blue</option>
                        <option value="forest">Forest Green</option>
                    </select>
                </div>
                <div class="result" id="settingsMsg">Theme saved in this browser.</div>
                <br>
                <div class="controls">
                    <button id="btnDeleteAccount" type="button">Delete Account</button>
                </div>
            </section>
        </section>

        <div id="modalOverlay" class="modalOverlay isHidden">
            <!-- Modals omitted for brevity, keeping existing modal structure -->
        </div>

        <footer class="foot">
            Saved in your account
        </footer>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
